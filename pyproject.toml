[project]
name = "fft-visualizer"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "dash (>=4.4.0,<5.0.0)",
    "tqdm (>=4.69.0,<5.0.0)"
]

[tool.poetry]
packages = [{include = "fft_visualizer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
